[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zcode-session-rescue"
version = "0.1.0"
description = "Safely restore and undo one ordinary ZCode chat session from an old SQLite database"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ZCode Session Rescue contributors"}]
dependencies = []

[project.scripts]
zcode-session-rescue = "zcode_session_rescue.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
